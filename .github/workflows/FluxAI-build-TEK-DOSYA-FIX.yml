name: FluxAI 2.0 - Single YAML APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: fluxai-single-yaml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FluxAI APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Restore embedded Android project
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const archive = Buffer.from(``, 'base64');
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/fluxai-project.zip`, archive);
            core.info(`Embedded Android project restored (${archive.length} bytes).`);

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fluxai-src"
          unzip -q "$RUNNER_TEMP/fluxai-project.zip" -d "$RUNNER_TEMP/fluxai-src"
          test -f "$RUNNER_TEMP/fluxai-src/FluxAI/app/build.gradle.kts"
          echo "PROJECT_DIR=$RUNNER_TEMP/fluxai-src/FluxAI" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GROQ_API_KEY:-}" ]; then
            gradle --no-daemon :app:assembleDebug -PGROQ_API_KEY="$GROQ_API_KEY"
          else
            gradle --no-daemon :app:assembleDebug
          fi
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/release/FluxAI-2.0.apk"
          test -s "$GITHUB_WORKSPACE/release/FluxAI-2.0.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxAI-2.0-APK
          path: release/FluxAI-2.0.apk
          if-no-files-found: error
          retention-days: 30
