name: FluxAI 2.0 - Self Contained APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: fluxai-self-contained-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Restore Android project embedded in this YAML
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/fluxai-project.zip.b64" <<'FLUXAI_BASE64'
