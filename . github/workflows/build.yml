name: FluxAI 2.0 - APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:bu
  group: fluxai-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.11.1'

      - name: Find Android project root
        shell: bash
        run: |
          if [ -f app/build.gradle.kts ]; then
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
          elif [ -f FluxAI/app/build.gradle.kts ]; then
            echo "PROJECT_DIR=$PWD/FluxAI" >> "$GITHUB_ENV"
          else
            echo "ERROR: app/build.gradle.kts bulunamadı. Android proje kökü eksik." >&2
            find . -maxdepth 4 -name build.gradle.kts -print
            exit 1
          fi

      - name: Install Pillow for icon processing
        run: python3 -m pip install --user pillow

      - name: Install redesigned FluxAI launcher icon
